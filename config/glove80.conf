# RGB underglow: on by default on Glove80 firmware, but set explicitly here
# since the OS-toggle keys (Magic layer) drive it via &rgb_ug RGB_COLOR_HSB.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n

# Pointer/mouse emulation for the Mouse layer (&mmv / &mkp / &msc).
CONFIG_ZMK_POINTING=y
